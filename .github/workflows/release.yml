name: Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload .debs to Nexus (e.g. v1.0.5)"
        required: true
        type: string

jobs:
  prepare-release:
    name: Bump Cargo.toml version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve release tag
        id: vars
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [ -z "$TAG" ]; then
            echo "failed to resolve release tag"
            exit 1
          fi

          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$'; then
            echo "tag must match vX.Y.Z"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Bump Cargo.toml version
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          # Strip prerelease suffix for Cargo.toml (e.g. 1.0.5-rc.1 -> 1.0.5)
          CARGO_VERSION="$(echo "$VERSION" | sed -E 's/[.-](rc|beta|alpha).*//')"
          sed -i '0,/^version = ".*"/s//version = "'"$CARGO_VERSION"'"/' Cargo.toml

      - name: Commit version sync
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.version }}"
          CARGO_VERSION="$(echo "$VERSION" | sed -E 's/[.-](rc|beta|alpha).*//')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Cargo.toml
          if git diff --cached --quiet; then
            echo "No Cargo.toml changes to commit"
          else
            git commit -m "release: bump version to $CARGO_VERSION"

            git fetch origin "${{ github.event.repository.default_branch }}"
            git rebase "origin/${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

  build-and-release:
    name: Build and Create Release
    if: github.event_name == 'push'
    needs: [prepare-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Set deb version
        id: deb_version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" =~ (rc|beta|alpha) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release binaries and .deb packages
        env:
          PACKAGE_CHANNEL: prod
          VERSION: ${{ steps.deb_version.outputs.version }}
          ARCHES: amd64
        run: ./scripts/build-deb.sh

      - name: Extract changelog
        env:
          REF: ${{ github.ref }}
        run: |
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## ${REF:10}/,/^## /{/^## /b;p}" CHANGELOG.md > ./RELEASE_CHANGELOG || true
          fi
          if [ ! -s ./RELEASE_CHANGELOG ]; then
            echo "FeatherTail ${{ steps.deb_version.outputs.version }}" > ./RELEASE_CHANGELOG
          fi

      - name: Create checksum and add to changelog
        run: |
          SUM=$(cd dist && sha256sum feathertail-linux-amd64)
          SUM2=$(cd dist && sha256sum feathertail_${{ steps.deb_version.outputs.version }}_amd64.deb)
          echo -e "\n#### SHA256 Checksum\n\`\`\`\n$SUM\n$SUM2\n\`\`\`\n" >> ./RELEASE_CHANGELOG
          echo -e "$SUM\n$SUM2" > checksums.txt

      # Stable tags publish immediately so apt can follow. Prereleases stay draft.
      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: ${{ steps.deb_version.outputs.is_prerelease == 'true' }}
          prerelease: ${{ steps.deb_version.outputs.is_prerelease == 'true' }}
          body_path: ./RELEASE_CHANGELOG
          files: |
            dist/feathertail-linux-amd64
            dist/feathertail_${{ steps.deb_version.outputs.version }}_amd64.deb
            checksums.txt

      # Upload from local dist after assets are attached — avoids the publish-vs-asset race.
      - name: Upload .deb packages to Nexus
        if: steps.deb_version.outputs.is_prerelease != 'true'
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_HOST: https://apt.mythicalsystems.org
          NEXUS_REPOSITORY: MythicalSystems
          NEXUS_CHECK_EXISTS: "1"
        run: |
          set -euo pipefail

          if [ -z "${NEXUS_USERNAME}" ] || [ -z "${NEXUS_PASSWORD}" ]; then
            echo "NEXUS_USERNAME and NEXUS_PASSWORD secrets must be configured"
            exit 1
          fi

          shopt -s nullglob
          deb_files=(dist/feathertail_*.deb)

          if [ "${#deb_files[@]}" -eq 0 ]; then
            echo "No .deb files to upload"
            exit 1
          fi

          for deb_file in "${deb_files[@]}"; do
            case "$(basename "${deb_file}")" in
              feathertail-dev_*)
                echo "Skipping unexpected -dev package on prod release: ${deb_file}"
                continue
                ;;
            esac
            set +e
            ./scripts/nexus-upload-deb.sh "${deb_file}"
            status=$?
            set -e
            # 0 = uploaded, 2 = already present, 3 = refused dirty version
            if [ "${status}" -eq 1 ] || [ "${status}" -eq 3 ]; then
              exit "${status}"
            fi
          done

  upload-to-nexus:
    name: Upload to Nexus APT Repository
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download .deb release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # When a release is published before tag CI finishes uploading assets,
          # wait rather than failing immediately.
          attempts=36
          delay=10
          deb_assets=()
          for ((i=1; i<=attempts; i++)); do
            mapfile -t deb_assets < <(gh release view "${TAG}" \
              --repo "${{ github.repository }}" \
              --json assets \
              -q '.assets[] | select(.name | (endswith(".deb") and startswith("feathertail_"))) | .name')

            filtered=()
            for asset in "${deb_assets[@]}"; do
              [ -n "${asset}" ] && filtered+=("${asset}")
            done
            deb_assets=("${filtered[@]+"${filtered[@]}"}")

            if [ "${#deb_assets[@]}" -gt 0 ]; then
              echo "Found .deb assets on attempt ${i}: ${deb_assets[*]}"
              break
            fi

            echo "No .deb assets on ${TAG} yet (attempt ${i}/${attempts}); waiting ${delay}s..."
            sleep "${delay}"
          done

          if [ "${#deb_assets[@]}" -eq 0 ]; then
            echo "No .deb assets found on release ${TAG} after waiting"
            exit 1
          fi

          for asset in "${deb_assets[@]}"; do
            gh release download "${TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "${asset}" \
              --dir dist
          done

      - name: Upload .deb packages to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_HOST: https://apt.mythicalsystems.org
          NEXUS_REPOSITORY: MythicalSystems
          NEXUS_CHECK_EXISTS: "1"
        run: |
          set -euo pipefail

          if [ -z "${NEXUS_USERNAME}" ] || [ -z "${NEXUS_PASSWORD}" ]; then
            echo "NEXUS_USERNAME and NEXUS_PASSWORD secrets must be configured"
            exit 1
          fi

          shopt -s nullglob
          deb_files=(dist/feathertail_*.deb)

          if [ "${#deb_files[@]}" -eq 0 ]; then
            echo "No .deb files to upload"
            exit 1
          fi

          for deb_file in "${deb_files[@]}"; do
            case "$(basename "${deb_file}")" in
              feathertail-dev_*)
                echo "Skipping unexpected -dev package on prod release: ${deb_file}"
                continue
                ;;
            esac
            set +e
            ./scripts/nexus-upload-deb.sh "${deb_file}"
            status=$?
            set -e
            if [ "${status}" -eq 1 ] || [ "${status}" -eq 3 ]; then
              exit "${status}"
            fi
          done
