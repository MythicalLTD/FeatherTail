[daemon]
name = "feathertail-proxmox"
poll_interval_secs = 15
log_level = "info-yapless"

[proxmox]
pvesh_bin = "pvesh"
pct_bin = "pct"

[api]
# Reachable from FeatherPanel by default. Firewall-restrict to the panel IP.
bind = "0.0.0.0:8686"

[auth]
# Overwritten by the FeatherPanel installer when FP_TAIL_TOKEN is set.
api_token = "change-me"
# Admin web UI (http://<node>:8686/ui/) password, set with `feathertail set-password`.
# The api_token above is accepted as a UI login too.
# admin_password_hash = ""

[dhcp]
# Keep disabled until you intentionally run DHCP on this node/bridge.
enabled = false
bind = "0.0.0.0:67"
server_ip = "10.0.0.1"
lease_time_secs = 86400
database_path = "/var/lib/feathertail/dhcp.sqlite3"
firewall_mode = "off"
firewall_allow_macs = []
firewall_deny_macs = []
firewall_allow_vmids = []
firewall_deny_vmids = []

# Simple DHCP without FeatherPanel: uncomment a range and set enabled = true above.
# Any client without a lease gets a free IP from the range (on that interface only).
# IPs used by static leases or the admin UI IP pool are skipped automatically.
# Repeat the [[dhcp.ranges]] block for more bridges/subnets.
#
# [[dhcp.ranges]]
# interface = "vmbr1"          # bridge to answer on; "" = any interface
# start = "10.0.0.100"
# end = "10.0.0.200"
# gateway = "10.0.0.1"
# cidr = 24
# dns_servers = ["1.1.1.1", "8.8.8.8"]
# server_ip = ""               # optional, defaults to the gateway
# lease_time_secs = 86400      # optional, defaults to dhcp.lease_time_secs
